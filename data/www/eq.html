<!DOCTYPE html><html><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>EQ - AirSPlay32</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#151923;min-height:100vh;padding:20px;color:#f6f7fb}
.wrap{max-width:640px;margin:0 auto}.header{text-align:center;padding:20px 0}.header h1{font-size:24px;font-weight:650;margin-bottom:4px}.header p{color:#9aa3b2;font-size:13px}
.nav{text-align:center;margin-bottom:16px}.nav a{color:#ff6b6b;text-decoration:none;font-size:13px}.card{background:#202635;border:1px solid #343d52;border-radius:8px;padding:20px;margin-bottom:16px}.card h2{font-size:16px;font-weight:650;margin-bottom:16px;color:#ff6b6b}
.row{display:flex;align-items:center;gap:12px;margin-bottom:16px}label{font-size:12px;color:#aab3c2;text-transform:uppercase}select{flex:1;background:#111722;border:1px solid #39445c;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px}select option{background:#111722}
.band{display:grid;grid-template-columns:64px 1fr 58px;align-items:center;gap:12px;margin:14px 0}.band input[type=range]{width:100%;accent-color:#ff6b6b}.freq{font-weight:650;color:#f6f7fb}.db{text-align:right;color:#c7cfdb;font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.meta div{background:#151b28;border-radius:8px;padding:10px}.meta span{display:block;color:#9aa3b2;font-size:11px;margin-bottom:3px}.meta b{font-size:13px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}.btn-primary{background:#ff6b6b;color:#111722}.btn-secondary{background:#30384b;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.dirty{color:#ffd166;font-size:13px}.msg{margin-top:12px;padding:9px;border-radius:8px;font-size:13px}.ok{background:#1b4332}.err{background:#5c1a1a}.info{background:#22304a}
</style></head><body>
<div class='wrap'><div class='header'><h1>Equalizer</h1><p>AirSPlay32 5-band software EQ</p></div><div class='nav'><a href='/'>&#8592; Back to Settings</a></div><div class='card'><h2>EQ</h2><div class='row'><label for='preset'>Preset</label><select id='preset'></select></div><div id='bands'></div><div class='meta'><div><span>Headroom</span><b id='preamp'>0.0 dB</b></div><div><span>Status</span><b id='dirty'>Saved</b></div></div><div class='actions'><button class='btn btn-primary' id='save' onclick='saveCustom()'>Save Custom</button><button class='btn btn-secondary' onclick='loadEQ()'>Refresh</button><span id='dirty-note' class='dirty'></span></div><div id='msg'></div></div></div>
<script>
var state=null;
function fmtFreq(v){return v>=1000?(v/1000).toFixed(v>=10000?0:1)+' kHz':Math.round(v)+' Hz';}
function fmtDb(v){return (v>0?'+':'')+Number(v).toFixed(1)+' dB';}
function note(txt,type){var e=document.getElementById('msg');e.innerHTML='<div class="msg '+type+'">'+txt+'</div>';setTimeout(function(){e.innerHTML='';},2500);}
function render(){if(!state)return;var p=document.getElementById('preset');p.innerHTML='';state.presets.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.name;p.appendChild(o);});p.value=String(state.mode);var b=document.getElementById('bands');b.innerHTML='';for(var i=0;i<state.bands;i++){var row=document.createElement('div');row.className='band';var f=document.createElement('div');f.className='freq';f.textContent=fmtFreq(state.freqs[i]);var s=document.createElement('input');s.type='range';s.min=state.min_db;s.max=state.max_db;s.step=state.step_db;s.value=state.gains[i];s.dataset.band=i;var d=document.createElement('div');d.className='db';d.id='db-'+i;d.textContent=fmtDb(state.gains[i]);s.onchange=function(e){setBand(Number(e.target.dataset.band),Number(e.target.value));};s.oninput=function(e){document.getElementById('db-'+e.target.dataset.band).textContent=fmtDb(e.target.value);};row.appendChild(f);row.appendChild(s);row.appendChild(d);b.appendChild(row);}document.getElementById('preamp').textContent=fmtDb(state.preamp_db);document.getElementById('dirty').textContent=state.custom_dirty?'Unsaved Custom':'Saved';document.getElementById('dirty-note').textContent=state.custom_dirty?'Custom has unsaved changes':'';document.getElementById('save').disabled=state.mode!==5||!state.custom_dirty;}
async function loadEQ(){try{var r=await fetch('/api/eq');state=await r.json();if(state.success){render();}else{note(state.error||'Load failed','err');}}catch(e){note('Load failed','err');}}
async function setPreset(mode){try{var r=await fetch('/api/eq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:Number(mode)})});var d=await r.json();if(d.success){state=d;render();note('EQ preset: '+d.mode_name,'ok');}else{note(d.error||'Preset failed','err');}}catch(e){note('Preset failed','err');}}
async function setBand(band,gain){try{var r=await fetch('/api/eq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({band:band,gain:gain})});var d=await r.json();if(d.success){state=d;render();}else{note(d.error||'Band update failed','err');}}catch(e){note('Band update failed','err');}}
async function saveCustom(){try{var r=await fetch('/api/eq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({save_custom:true})});var d=await r.json();if(d.success){state=d;render();note('EQ custom saved','ok');}else{note(d.error||'Save failed','err');}}catch(e){note('Save failed','err');}}
document.getElementById('preset').onchange=function(){setPreset(this.value);};window.onload=loadEQ;
</script></body></html>
